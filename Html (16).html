<script>
(function(){
 function fatal(msg){var a=document.getElementById('app');if(!a)return;if(a.querySelector('.screen,.game'))return;
  a.innerHTML='<div style="height:100%;display:flex;align-items:center;justify-content:center;padding:16px"><div style="max-width:520px;background:rgba(30,24,70,.95);border:1px solid #ffd27a;border-radius:18px;padding:18px;color:#fbf3e4;font-family:Sarabun,Tahoma,sans-serif;text-align:center"><h2 style="color:#ffe3a3;margin-bottom:8px">ไม่สามารถเริ่มเกมได้</h2><p style="font-size:14px;margin-bottom:10px">'+String(msg).replace(/</g,'&lt;')+'</p><button onclick="location.reload()" style="padding:10px 20px;border-radius:12px;border:0;background:#ffb547;font-weight:700;cursor:pointer">โหลดใหม่</button></div></div>';}
 window.LIfatal=fatal;

<script async src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--night:#0f0b2a;--ink:#1d1838;--txt:#fbf3e4;--txt2:#cfc6ec;--gold:#ffd27a;--amber:#ffb547;--glow:#ffe3a3;--mist:#5fe0d0;
--rim:rgba(255,227,163,.36);--sh-1:0 2px 4px rgba(5,3,20,.35),0 8px 18px rgba(5,3,20,.32);--sh-2:0 18px 44px rgba(5,3,20,.6),0 2px 6px rgba(5,3,20,.4);
--glass:linear-gradient(165deg,rgba(78,64,160,.8),rgba(34,26,84,.9) 55%,rgba(18,14,48,.95));--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Sarabun','Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;color:var(--txt);background:var(--night);line-height:1.45;-webkit-font-smoothing:antialiased}
#app{position:relative;z-index:1;height:100vh;height:100dvh;overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
h1,h2,h3,h4{font-family:'Mitr','Sarabun',sans-serif;font-weight:500;line-height:1.3}
small{font-size:.82em;opacity:.85}
#world{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,#090720 0%,#1a1450 38%,#3b2a78 66%,#8a4f86 88%,#d9806e 100%)}
#world .aurora{position:absolute;width:90vw;height:40vh;border-radius:50%;filter:blur(60px);opacity:.45;mix-blend-mode:screen}
#world .a1{left:-20vw;top:4vh;background:radial-gradient(closest-side,#4fe3c8,transparent);animation:aur 18s ease-in-out infinite alternate}
#world .a2{right:-25vw;top:14vh;background:radial-gradient(closest-side,#9b6bff,transparent);animation:aur 22s ease-in-out infinite alternate-reverse}
@keyframes aur{from{transform:translate(0,0) scale(1)}to{transform:translate(12vw,4vh) scale(1.2)}}
#world .stars{position:absolute;inset:0;background-image:radial-gradient(1.2px 1.2px at 23px 41px,#fff,transparent),radial-gradient(1px 1px at 97px 13px,#fff,transparent),radial-gradient(1.5px 1.5px at 151px 88px,#fff8d8,transparent),radial-gradient(1px 1px at 61px 131px,#fff,transparent),radial-gradient(1.7px 1.7px at 181px 171px,#dfe8ff,transparent),radial-gradient(1px 1px at 121px 191px,#fff,transparent);background-size:200px 200px;animation:twinkle 5s ease-in-out infinite alternate;-webkit-mask-image:linear-gradient(#000 30%,transparent 78%);mask-image:linear-gradient(#000 30%,transparent 78%)}
#world .stars.s2{background-size:290px 260px;background-position:40px 70px;animation-delay:-2.5s}
@keyframes twinkle{from{opacity:.3}to{opacity:1}}
#world .moon{position:absolute;right:8vw;top:7vh;width:min(20vw,140px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 36% 32%,#fffdf4,#fff1cc 45%,#f0d394 80%);box-shadow:0 0 50px 14px rgba(255,236,190,.35),0 0 160px 60px rgba(255,180,150,.18);animation:moonG 6s ease-in-out infinite alternate}
#world .moon i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 62% 60%,rgba(190,160,100,.3) 0 9%,transparent 10%),radial-gradient(circle at 35% 70%,rgba(190,160,100,.26) 0 6%,transparent 7%),radial-gradient(circle at 70% 30%,rgba(190,160,100,.2) 0 5%,transparent 6%)}
@keyframes moonG{to{box-shadow:0 0 70px 20px rgba(255,236,190,.42),0 0 190px 70px rgba(255,180,150,.22)}}
#world .shoot{position:absolute;top:12vh;left:10vw;width:140px;height:2px;background:linear-gradient(90deg,transparent,#fff);border-radius:2px;opacity:0;transform:rotate(-18deg);animation:shoot 9s ease-in infinite 3s}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-18deg)}3%{opacity:1}10%{opacity:0;transform:translate(45vw,15vh) rotate(-18deg)}100%{opacity:0}}
#world .cloud{position:absolute;left:0;height:30px;border-radius:40px;background:rgba(255,226,240,.1);filter:blur(8px);animation:cloud linear infinite}
@keyframes cloud{from{transform:translateX(-40vw)}to{transform:translateX(140vw)}}
#world .isles{position:absolute;left:-6%;width:112%;bottom:-2vh;height:44vh}
#world .isles.far{opacity:.75;animation:drift 42s ease-in-out infinite alternate}
#world .isles.near{height:34vh;bottom:-4vh;animation:drift 30s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate3d(-1.6%,0,0)}to{transform:translate3d(1.6%,-1.4%,0)}}
#world .fall{animation:fall 3s ease-in-out infinite alternate}
@keyframes fall{to{opacity:.35}}
#world .lan{position:absolute;bottom:-60px;width:var(--s);height:calc(var(--s)*1.25);border-radius:40% 40% 34% 34%;background:radial-gradient(circle at 50% 40%,#fff8d8,#ffcf6b 45%,#f0802a 92%);box-shadow:0 0 calc(var(--s)*.9) calc(var(--s)*.25) rgba(255,170,70,.42);animation:rise var(--d) linear infinite;animation-delay:var(--dl)}
#world .lan::before{content:'';position:absolute;left:22%;right:22%;top:-9%;height:10%;background:#7a3d17;border-radius:2px}
@keyframes rise{0%{transform:translate(0,0)}25%{transform:translate(12px,-30vh)}50%{transform:translate(-9px,-62vh)}75%{transform:translate(10px,-92vh);opacity:.85}100%{transform:translate(0,-128vh);opacity:0}}
body.ingame #world .lan{opacity:.28}body.ingame #world .isles{opacity:.2}body.ingame #world .moon{opacity:.45}body.ingame #world .aurora{opacity:.25}
.screen{height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.enter{animation:scrIn .45s var(--ease)}

[data-fit]{transform-origin:center center;flex:0 0 auto}
.panel{position:relative;width:min(600px,100%);padding:20px 18px 16px;border-radius:24px;background:var(--glass);border:1px solid var(--rim);box-shadow:var(--sh-2),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -24px 44px rgba(0,0,0,.25)}

.panel h2{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:21px;color:var(--glow);text-shadow:0 2px 12px rgba(255,180,80,.4);margin-bottom:10px}
.col{display:flex;flex-direction:column;gap:9px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lb{font-weight:700;font-size:13px;color:#ffd99a}

.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 18px;border-radius:14px;font-weight:700;font-size:15px;color:#3a1d05;border:1px solid #ffe9b8;background:linear-gradient(180deg,#ffe8a6 0%,#ffb24d 52%,#e8762a 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -3px 0 rgba(150,60,0,.28),0 4px 0 #8e4210,0 10px 22px rgba(255,140,40,.28);transition:transform .12s var(--ease),filter .12s;text-shadow:0 1px 0 rgba(255,255,255,.45)}
.btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .5s;pointer-events:none}
.btn:hover::after{left:130%}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px)}
.btn:disabled{filter:grayscale(.7) brightness(.75);cursor:not-allowed;transform:none}
.btn.alt{color:var(--txt);text-shadow:none;border-color:rgba(255,227,163,.4);background:linear-gradient(180deg,rgba(130,110,230,.6),rgba(50,40,120,.85));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -3px 0 rgba(0,0,0,.25),0 4px 0 #181240,0 8px 16px rgba(0,0,0,.3)}
.btn.big{width:100%;min-height:50px;font-size:17px;font-family:'Mitr',sans-serif;font-weight:500}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:11px}
.btn .ico{width:1.15em;height:1.15em}
input[type=text]{width:100%;padding:11px 14px;border-radius:12px;border:1px solid rgba(255,227,163,.35);background:rgba(10,8,30,.55);color:var(--txt);font:inherit;font-size:16px;box-shadow:inset 0 2px 6px rgba(0,0,0,.45);outline:none}
input[type=text]:focus{border-color:var(--amber)}
input::placeholder{color:rgba(220,210,255,.4)}
.ico,.lico{width:18px;height:18px;flex:0 0 auto}
.ci{width:1.05em;height:1.05em;vertical-align:-.17em;flex:0 0 auto}
.badge{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;flex:0 0 auto;vertical-align:middle;background:radial-gradient(circle at 35% 30%,var(--fl),var(--fc) 55%,var(--fd));box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -2px 3px rgba(0,0,0,.3),0 0 0 1.5px #f2cf86,0 2px 6px rgba(0,0,0,.45)}
.badge svg{width:72%;height:72%;color:#fff}
.badge.xs{font-size:11px;margin-right:3px}.badge.md{font-size:20px}.badge.lg{font-size:26px}
.tm2{display:inline-flex;align-items:center;gap:3px;font-size:11px;border-radius:999px;padding:1px 8px;font-weight:700;white-space:nowrap;vertical-align:1px}
.tm2.now{background:linear-gradient(#fff0b8,#ffb547);color:#4a2400}.tm2.end{background:linear-gradient(#c9d8ff,#5b7fe0);color:#fff}.tm2.pass{background:linear-gradient(#c8f7e4,#25a57a);color:#fff}.tm2.none{background:rgba(255,255,255,.18);color:var(--txt2)}
.status{font-size:13px;font-weight:700;color:#8ef0c6;text-align:center}
.status.good{color:var(--gold);font-size:15px}
.spin{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:var(--amber);animation:sp 1s linear infinite;margin-right:6px;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
.warn{background:rgba(255,181,71,.12);border:1px solid rgba(255,181,71,.45);border-radius:10px;padding:7px 10px;font-size:12.5px;color:#ffe3b0;margin-top:8px}
.note{font-size:12.5px;color:var(--txt2);background:rgba(10,8,30,.35);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 10px}
.menu-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(520px,100%);text-align:center}
.mleft,.mright{display:flex;flex-direction:column;align-items:center;gap:10px}
.mascot{width:min(124px,30vw);position:relative}
.mascot::after{content:'';position:absolute;left:20%;right:20%;bottom:-6px;height:10px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(4px);animation:shad 3.4s ease-in-out infinite}
@keyframes shad{50%{transform:scaleX(.8);opacity:.6}}
.lumi{width:100%;height:auto;aspect-ratio:120/160;display:block;animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(255,160,60,.35));overflow:visible}
.lumi .wl{transform-origin:36px 74px;transform-box:view-box;animation:flapL 1.8s ease-in-out infinite}
.lumi .wr{transform-origin:84px 74px;transform-box:view-box;animation:flapR 1.8s ease-in-out infinite}
.lumi .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.lumi .lglow{animation:pulse 3.4s ease-in-out infinite}
.lumi .star{transform-box:fill-box;transform-origin:center;animation:spinS 6s linear infinite}
.lumi .tail{animation:sway 2.4s ease-in-out infinite;transform-box:view-box;transform-origin:60px 128px}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes flapL{50%{transform:rotate(-12deg)}}@keyframes flapR{50%{transform:rotate(12deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

.guild-row{display:flex;gap:10px;justify-content:center}
.guild-row .badge{animation:bob 4s ease-in-out infinite}

.logo-en{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(38px,10vw,66px);line-height:.95;letter-spacing:.07em;background:linear-gradient(180deg,#fffbe6 8%,#ffd27a 48%,#d9822b 92%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #4a2208) drop-shadow(0 0 22px rgba(255,180,80,.45))}
.logo-en span{display:block;font-size:.6em;letter-spacing:.5em;margin:4px 0 0 .5em}
.logo-th{font-family:'Mitr',sans-serif;font-weight:500;font-size:clamp(22px,6vw,34px);color:#fff3d6;text-shadow:0 2px 0 #3a1d5a,0 0 16px rgba(255,200,120,.5);margin-top:4px}
.logo-sub{display:flex;align-items:center;gap:10px;justify-content:center;font-size:14px;color:#ffd99a}
.logo-sub::before,.logo-sub::after{content:'';width:34px;height:1px;background:linear-gradient(90deg,transparent,#ffd99a)}
.logo-sub::after{transform:scaleX(-1)}
.lore{font-size:13.5px;color:var(--txt2);max-width:440px;line-height:1.6}
.menu-btns{display:flex;flex-direction:column;gap:9px;width:min(340px,100%)}
.menu-btns .row2{display:flex;gap:8px}.menu-btns .row2 .btn{flex:1}
.ver{font-size:11px;color:rgba(220,210,255,.5)}
@media (orientation:landscape) and (max-height:560px){.menu-wrap{flex-direction:row;width:min(780px,100%);gap:28px}.mascot{width:min(110px,22vh)}}
.modes{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:620px),(orientation:landscape){.modes{grid-template-columns:1fr 1fr}}
.mode{position:relative;overflow:hidden;text-align:left;border-radius:18px;padding:14px;border:1px solid rgba(255,227,163,.45);color:var(--txt);box-shadow:var(--sh-1),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .2s var(--ease)}

.room{display:flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:rgba(8,6,24,.6);border:1px solid rgba(255,227,163,.4);font-size:12px;flex:0 0 auto}
.room .ico{width:13px;height:13px;color:var(--gold)}
.room b{font-family:'Cinzel',serif;letter-spacing:2px;color:var(--gold)}
.dot{width:8px;height:8px;border-radius:50%}.dot.ok{background:#4ade80;box-shadow:0 0 6px #4ade80}.dot.bad{background:#f87171}
.pstrip{grid-area:ps;display:flex;gap:5px;min-width:0;padding-top:4px}
.chip{position:relative;flex:1 1 0;min-width:0;display:flex;align-items:center;gap:6px;padding:4px 6px 4px 4px;border-radius:12px;background:linear-gradient(180deg,rgba(70,58,145,.85),rgba(26,21,64,.9));border:1px solid rgba(255,255,255,.12);border-bottom:3px solid var(--fc);box-shadow:var(--sh-1);transition:transform .25s var(--ease)}
.chip .badge{font-size:14px}
.chip .cm{min-width:0;flex:1}
.chip .cn{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden}
.chip .cn span{overflow:hidden;text-overflow:ellipsis}
.chip .fl,.chip .bt{width:13px;height:13px;flex:0 0 auto;color:var(--gold)}
.chip .bt{color:var(--txt2)}
.chip .cs{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--txt2);white-space:nowrap}
.chip .cs b{color:var(--gold);font-size:13px}
.mc{display:inline-block;width:7px;height:10px;border-radius:2px;background:linear-gradient(160deg,var(--fl),var(--fc));border:1px solid #f2cf86;vertical-align:-1px;margin-right:2px}
.chip .st{position:absolute;top:-6px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;font-size:10px;font-weight:700;display:grid;place-items:center;background:#3a3170;border:1px solid rgba(255,255,255,.35)}
.st.ok{background:#1f9a6e}.st.go{background:var(--amber);color:#3a1d05}
.chip.me{border-color:rgba(255,227,163,.65);border-bottom-color:var(--fc)}
.chip.act{box-shadow:0 0 0 2px var(--amber),0 0 18px rgba(255,181,71,.55);animation:breathe 1.4s ease-in-out infinite}
.chip.off{opacity:.5;filter:grayscale(.7)}
.chip.bump{transform:scale(1.08)}
@keyframes breathe{50%{filter:brightness(1.18)}}
@media(max-width:480px){.chip .xs{display:none}.chip{gap:4px;padding-right:4px}.chip .badge{font-size:12px}}
.board{grid-area:board;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:5px;min-height:0}
.loc{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;border-radius:16px;overflow:hidden;border:1px solid rgba(255,227,163,.42);box-shadow:var(--sh-1)}
.loc .scene{position:absolute;inset:0;width:100%;height:100%;z-index:0;animation:pan 36s ease-in-out infinite alternate}
@keyframes pan{from{transform:scale(1.04) translateX(-1%)}to{transform:scale(1.08) translateX(1%)}}
.loc::after{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(12,9,34,.6) 0%,rgba(12,9,34,.1) 38%,rgba(12,9,34,.42) 100%)}
.loc>*:not(.scene){position:relative;z-index:1}
.lh{display:flex;align-items:center;gap:6px;padding:5px 7px 0;min-width:0}
.lname{display:flex;align-items:center;gap:4px;padding:2px 9px 2px 5px;border-radius:999px;background:rgba(20,15,50,.82);border:1px solid rgba(255,227,163,.5);font-family:'Mitr',sans-serif;font-size:13px;color:var(--glow);white-space:nowrap;flex:0 0 auto}
.lname .lico{width:16px;height:16px;color:var(--gold)}
.lside{font-size:12px;color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.rws{display:flex;gap:3px;align-items:center;flex:0 0 auto}
.rw{display:inline-flex;align-items:center;gap:2px;padding:1px 6px 1px 2px;border-radius:999px;background:rgba(15,10,40,.75);border:1px solid rgba(255,210,122,.5);font-size:11.5px;font-weight:700;color:var(--gold)}
.rw i{font-style:normal;width:14px;height:14px;border-radius:50%;display:grid;place-items:center;font-size:9px;background:linear-gradient(#fff4c2,#d99a2b);color:#3a1d05}
.lsp{font-size:11px;color:#f2e8ff;text-shadow:0 1px 2px #000;padding:1px 10px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flag{font-size:10.5px;padding:1px 7px;border-radius:999px;background:linear-gradient(#d4475e,#8f2238);color:#fff;white-space:nowrap;flex:0 0 auto}
.cards{flex:1;min-height:0;display:flex;gap:4px;align-items:center;padding:4px 8px 6px;overflow:hidden}
.cards.wrap{flex-wrap:wrap;align-content:center}
.cards .card{width:calc(var(--h,80px)*.7);height:var(--h,80px)}
.empty{font-size:12px;color:rgba(255,255,255,.6);margin:auto;font-style:italic}
.loc.pickable{cursor:pointer;border-color:var(--amber);box-shadow:0 0 0 2px var(--amber),0 0 22px rgba(255,181,71,.5);animation:breathe 1.3s ease-in-out infinite}
.droptag{position:absolute!important;right:8px;bottom:6px;z-index:2!important;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:linear-gradient(#ffe08f,#e2741f);color:#3a1d05;pointer-events:none}
.prompt{grid-area:prompt;max-height:30vh;max-height:30dvh;overflow:hidden;border-radius:14px;padding:7px 10px;background:linear-gradient(180deg,rgba(70,58,145,.92),rgba(24,19,60,.95));border:1px solid rgba(255,227,163,.32);box-shadow:var(--sh-1);font-size:13.5px;min-width:0}
.prompt.yours{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),0 0 18px rgba(255,181,71,.3)}
.ph{line-height:1.45}
.pd{font-size:12.5px;color:var(--txt2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hint{font-size:12.5px;color:var(--txt2);margin-top:3px}
.yt{display:inline-block;font-family:'Mitr',sans-serif;font-size:12px;padding:0 8px;border-radius:999px;background:linear-gradient(#ffe08f,#e2741f);color:#3a1d05;margin-right:4px}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.opts .btn{min-height:34px}
.rv{display:flex;gap:10px;align-items:flex-start}
.rvt{flex:1;min-width:0}
.order{font-size:12px;color:var(--txt2);margin-top:4px;line-height:1.8}
.hand{grid-area:hand;display:flex;align-items:flex-end;gap:8px;padding:16px 8px 6px;border-radius:16px;min-width:0;overflow:hidden;background:linear-gradient(180deg,rgba(48,36,104,.94),rgba(14,10,36,.97));border:1px solid rgba(255,227,163,.32);box-shadow:var(--sh-1),inset 0 2px 0 rgba(255,210,122,.25)}
.hlab{flex:0 0 auto;font-size:10.5px;color:var(--txt2);text-align:center;line-height:1.2;align-self:center}
.hlab b{display:block;font-family:'Mitr',sans-serif;font-weight:500;color:var(--glow);font-size:13px}
.hrow{flex:1;min-width:0;display:flex;gap:6px;align-items:flex-end;justify-content:center}
.hsep{flex:0 0 auto;width:2px;align-self:stretch;margin:0 4px;background:linear-gradient(transparent,rgba(255,210,122,.6),transparent)}
.card.hcard{width:var(--hw);height:calc(var(--hw)*1.4)}
.card.mid{width:calc(var(--hw)*.85);height:calc(var(--hw)*.85*1.4)}
.card{position:relative;flex:0 0 auto;container-type:inline-size;border-radius:9px;background:linear-gradient(160deg,var(--fl) 0%,var(--fc) 32%,var(--fd) 100%);border:1.5px solid #f5dca0;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -3px 6px rgba(0,0,0,.3),0 2px 3px rgba(5,3,20,.5),0 7px 14px rgba(5,3,20,.35);overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .16s var(--ease),box-shadow .16s;color:var(--ink)}
.card::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:4;background:linear-gradient(115deg,rgba(255,255,255,.3) 0%,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 60%,rgba(255,255,255,.22) 70%,rgba(255,255,255,0) 80%);background-size:250% 100%;background-position:100% 0;transition:background-position .8s}
.card:hover::after,.card.sel::after{background-position:0 0}
.card .win{position:absolute;left:8%;right:8%;top:6%;bottom:21%;overflow:hidden;border-radius:45% 45% 10% 10%/32% 32% 8% 8%;background:radial-gradient(circle at 50% 22%,#7562d8 0%,#2c2470 52%,#16113a 100%);box-shadow:inset 0 0 0 1.5px rgba(255,227,163,.8),inset 0 4px 10px rgba(0,0,0,.55)}
.card .art{position:absolute;inset:0;width:100%;height:100%;color:var(--fc)}
.card.back{background:radial-gradient(circle at 50% 40%,#4a3aa0,#1a1446);border-color:var(--fc)}
.card .val{position:absolute;top:3%;left:4%;z-index:2;width:30cqw;height:30cqw;min-width:14px;min-height:14px;display:grid;place-items:center;border-radius:50%;font:600 12px/1 'Mitr',sans-serif;font-size:17cqw;color:#3a1d05;background:radial-gradient(circle at 35% 30%,#fffbe6,#f7c650 52%,#b8711d);box-shadow:0 1px 2px rgba(0,0,0,.5),0 0 0 1px #7a4d12}
.card .tm{position:absolute;top:3%;right:4%;z-index:2;width:22cqw;height:22cqw;display:grid;place-items:center;border-radius:50%;font-size:9px;font-size:13cqw;line-height:1;box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.tm.now{background:radial-gradient(circle at 35% 30%,#fff3c4,#ffb547);color:#5a2a00}
.tm.end{background:radial-gradient(circle at 35% 30%,#d9e6ff,#5b7fe0);color:#fff}
.tm.pass{background:radial-gradient(circle at 35% 30%,#d6ffef,#25a57a);color:#fff}
.card .emb{position:absolute;right:5%;bottom:22%;z-index:2;width:22cqw;height:22cqw;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--fl),var(--fc) 60%,var(--fd));box-shadow:0 0 0 1px #f5dca0}
.card .emb svg{width:72%;height:72%;color:#fff}
.card .nm{position:absolute;left:5%;right:5%;bottom:4%;z-index:2;height:19cqw;line-height:19cqw;display:block;text-align:center;border-radius:4px;font-size:9px;font-size:10.5cqw;font-weight:700;color:#3a2310;background:linear-gradient(180deg,#fff8e6,#efd8a2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.tiny .card .nm{display:none}.tiny .card .win{bottom:5%}.tiny .card .emb{bottom:6%}
.card .rb{position:absolute;left:50%;top:40%;transform:translateX(-50%);z-index:3;padding:0 6px;border-radius:999px;font:600 11px/1.5 'Mitr',sans-serif;font-size:17cqw;color:#3a1d05;background:linear-gradient(#fff4c2,#f0b13a);box-shadow:0 0 0 1px #7a4d12,0 0 10px rgba(255,200,80,.6);white-space:nowrap}
.card.cx .tm{filter:grayscale(1);opacity:.55}
.card.cx::before{content:'';position:absolute;top:3%;right:4%;width:22cqw;height:22cqw;z-index:3;background:linear-gradient(45deg,transparent 44%,#ff5a6a 44% 56%,transparent 56%)}
.card.tgt{border-color:#bff3ea;box-shadow:0 0 0 2px var(--mist),0 0 16px var(--mist);animation:tgtp .8s ease-in-out infinite alternate}
@keyframes tgtp{to{transform:translateY(-3px)}}
.card.sel{transform:translateY(-12px) scale(1.04);border-color:#fff3c4;box-shadow:0 0 0 2px #ffe3a3,0 0 22px rgba(255,190,90,.8);z-index:5}
@media(hover:hover){.hand .card:hover{transform:translateY(-7px);z-index:4}.hand .card.sel:hover{transform:translateY(-12px) scale(1.04)}}
.card .ctag{position:absolute;left:0;right:0;top:42%;z-index:3;text-align:center;font-size:9px;font-size:13cqw;font-weight:700;color:#fff;background:rgba(20,15,50,.82);padding:1px 0}
.card.big{width:min(170px,38vw);height:calc(min(170px,38vw)*1.4)}
.rcard{width:100%!important;height:auto!important;aspect-ratio:5/7}
@keyframes flip{0%{transform:perspective(600px) rotateY(90deg) scale(.8);filter:brightness(2)}100%{transform:none}}
.flip{animation:flip .45s var(--ease)}
@keyframes pop{0%{transform:scale(.3) translateY(-20px);opacity:0}70%{transform:scale(1.1)}100%{transform:none;opacity:1}}
.pop{animation:pop .38s var(--ease)}
.ovl{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden;background:radial-gradient(circle at 50% 40%,rgba(40,30,90,.6),rgba(8,6,22,.88));animation:fade .3s}
@keyframes fade{from{opacity:0}}
.ovbox{width:min(820px,100%)}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(max-width:640px) and (orientation:portrait){.sgrid{grid-template-columns:1fr}}
.sl{border-radius:14px;padding:8px;background:rgba(10,8,30,.45);border:1px solid rgba(255,227,163,.2);min-width:0}
.sl h4{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--glow);margin-bottom:4px;flex-wrap:wrap}
.sl h4 small{font-size:12px;color:var(--txt2)}
.sl.castle{border-top:3px solid #8a6ae0}.sl.village{border-top:3px solid #f08a5a}.sl.port{border-top:3px solid #4fb8c8}
.aw{display:flex;align-items:center;gap:6px;font-size:13px;padding:2px 0;min-width:0}
.aw .cnm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt2)}
.aw.eff .cnm{color:#c9d8ff}
.g{color:var(--gold);white-space:nowrap}
.rk{font-style:normal;flex:0 0 auto;min-width:20px;height:20px;padding:0 4px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#3a1d05;background:linear-gradient(#fff4c2,#d99a2b)}
.rk.r2{background:linear-gradient(#ffffff,#a9b4cc)}.rk.r3{background:linear-gradient(#ffd9b8,#c07a45)}.rk.r4{background:linear-gradient(#e6dcff,#8a7ac0)}.rk.rl{background:linear-gradient(#c8f7e4,#25a57a);color:#fff}.rk.re{background:linear-gradient(#d9e6ff,#5b7fe0);color:#fff}
.ptag{display:inline-flex;align-items:center;gap:3px;font-weight:700;white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.tagl{font-size:11.5px;color:#ffc2cc}
.none{font-size:12px;color:var(--txt2);font-style:italic}
.foot{font-size:11.5px;color:var(--txt2);margin-top:4px;border-top:1px dashed rgba(255,255,255,.15);padding-top:3px}
.gains{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin:10px 0}
.gn{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:12px;background:rgba(10,8,30,.5);border-bottom:3px solid var(--fc);font-size:13px;min-width:0}
.gn span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gn b{color:#8ef0c6}.gn .tot{flex:0 0 auto;color:var(--gold);font-weight:700}
.trophy{display:flex;justify-content:center}
.trophy svg{width:110px;height:100px;filter:drop-shadow(0 8px 16px rgba(255,180,80,.45));animation:bob 3s ease-in-out infinite}
.winner{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;font:500 22px 'Mitr',sans-serif;color:#fff3d6;text-shadow:0 0 14px rgba(255,200,120,.6);margin:2px 0 6px;text-align:center}
.stands{display:grid;gap:5px;margin:6px 0}
.stand{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:12px;background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(10,8,30,.5));border-left:5px solid var(--fc);font-weight:700}
.stand.w{box-shadow:0 0 0 1px var(--gold),0 0 16px rgba(255,200,100,.35)}
.stand .gg{margin-left:auto;font:600 18px 'Mitr',sans-serif;color:var(--gold);display:flex;align-items:center;gap:4px}
table.rc{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;margin:6px 0;border-radius:10px;overflow:hidden}
table.rc th,table.rc td{padding:4px 6px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08)}
table.rc th{background:rgba(255,210,122,.18);color:var(--glow);font-weight:600}
table.rc td{background:rgba(10,8,30,.35)}
.subh{font-size:14px;color:var(--glow);margin-top:6px;text-align:center}
.cbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
#modal .mbg{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden;background:rgba(8,6,22,.75);animation:fade .2s}
#modal .mbox{width:min(760px,100%)}
#modal .mbox.scroll{max-height:88vh;max-height:88dvh;overflow:auto}
.mfoot{display:flex;justify-content:flex-end;margin-top:10px}
#modal h3{color:var(--glow);font-size:15px;margin-bottom:3px;display:flex;align-items:center;gap:5px}
#modal p,#modal li{font-size:13.5px;line-height:1.55}
#modal ul{padding-left:18px}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid rgba(255,227,163,.35);background:rgba(10,8,30,.4);color:var(--txt2)}
.tab.on{background:linear-gradient(#ffe08f,#e2741f);color:#3a1d05}
.howgrid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:640px),(orientation:landscape){.howgrid{grid-template-columns:1fr 1fr}}
.hw{background:rgba(10,8,30,.35);border-radius:12px;padding:8px 10px;border:1px solid rgba(255,255,255,.08)}
.chargrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
@media(min-aspect-ratio:1/1){.chargrid{grid-template-columns:repeat(8,minmax(0,1fr))}}
.locgrid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:640px),(orientation:landscape){.locgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lcol{background:rgba(10,8,30,.35);border-radius:12px;padding:8px}
.lrow{font-size:12.5px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
.lrow .rwt{float:right;color:var(--gold);font-weight:700}
.lrow small{display:block;color:var(--txt2)}
.det{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:center}
.dinfo{flex:1;min-width:210px}
.dinfo h2{justify-content:flex-start!important}
.dv{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font:600 18px 'Mitr',sans-serif;color:#3a1d05;background:radial-gradient(circle at 35% 30%,#fffbe6,#f7c650 52%,#b8711d)}
.flav{font-style:italic;color:#e8dcff;margin-bottom:6px}
.dinfo p{margin:3px 0}
.logl{font-size:13px;line-height:1.55}
.logl div{border-bottom:1px dotted rgba(255,255,255,.12);padding:3px 0}
.logl .lr{color:var(--gold);font-size:11px;margin-right:4px}
.tgl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed rgba(255,255,255,.15);font-weight:600}
.sw{display:inline-flex;align-items:center;gap:8px;border:none;background:none;font-size:13px}
.sw i{position:relative;width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.18);transition:background .2s}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:linear-gradient(#fff,#d9d2f0);transition:transform .2s var(--ease)}
.sw.on i{background:linear-gradient(#ffd27a,#e2741f)}.sw.on i::after{transform:translateX(20px)}
.slider{width:100%;accent-color:var(--amber);margin-top:6px}
.netban{position:absolute;left:8px;right:8px;top:50px;z-index:25;background:linear-gradient(#b2304a,#7a1f2e);color:#fff;text-align:center;font-size:13px;padding:5px;border-radius:10px}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:80;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:min(92vw,420px)}
#toast div{background:linear-gradient(180deg,rgba(70,58,145,.96),rgba(24,19,60,.97));color:var(--txt);border:1px solid var(--rim);border-radius:12px;padding:8px 14px;font-size:14px;animation:fade .25s;box-shadow:var(--sh-2);text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.coin{position:absolute;width:24px;height:24px}
.coin svg{width:100%;height:100%}
.cfloat{position:absolute;transform:translate(-50%,-50%);font:600 18px 'Mitr',sans-serif;color:#ffd54a;text-shadow:0 2px 4px #000;animation:floatup 1.2s ease-out forwards;white-space:nowrap}
.cfloat.neg{color:#ff8a8a}
@keyframes floatup{to{transform:translate(-50%,-260%);opacity:0}}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font:500 clamp(30px,8vw,56px) 'Mitr',sans-serif;color:#fff3c4;white-space:nowrap;text-shadow:0 0 22px rgba(255,180,80,.85),0 4px 0 #6a3412;animation:banner 1.7s var(--ease) forwards;text-align:center}

}

/* ---------- core board helpers ---------- */
function findCard(B,id){for(var li=0;li<B.locs.length;li++){var cs=B.locs[li].cards;for(var i=0;i<cs.length;i++)if(cs[i].id===id)return {li:li,i:i,c:cs[i]};}return null;}
function removeCard(B,id){var f=findCard(B,id);if(!f)return null;B.locs[f.li].cards.splice(f.i,1);return f.c;}
function isProt(c){return CHARS[c.v].k==='knight';}
function autoPos(cards,v){var i=0;while(i<cards.length&&cards[i].v>=v)i++;return i;}
function tiePositions(cards,v){var f=-1,l=-1;cards.forEach(function(c,i){if(c.v===v){if(f<0)f=i;l=i;}});if(f<0)return null;var r=[];for(var p=f;p<=l+1;p++)r.push(p);return r;}
function scoreLoc(L){
 var cards=L.cards,sp=L.side.sp,R=L.side.r,canceled={},i,c;
 cards.forEach(function(c){if(CHARS[c.v].k==='witch'&&!canceled[c.id]){cards.forEach(function(d){if(d.v<c.v&&CHARS[d.v].t==='end')canceled[d.id]=1;});}});
 var reversed=false;cards.forEach(function(c){if(CHARS[c.v].k==='traitor'&&!canceled[c.id])reversed=!reversed;});
 var rank=reversed?cards.slice().reverse():cards.slice();
 var awards=[],rewarded={},blocked=!!(sp&&sp.k==='need'&&cards.length<sp.v);
 if(!blocked){var fams={},k=0;
  for(i=0;i<rank.length;i++){c=rank[i];if(k>=R.length)break;if(sp&&sp.k==='min'&&c.v<sp.v)continue;if(sp&&sp.k==='one'&&fams[c.owner])continue;
   awards.push({id:c.id,owner:c.owner,fam:c.fam,v:c.v,amt:R[k],place:k+1});rewarded[c.id]=1;fams[c.owner]=1;k++;}
  if(sp&&sp.k==='low'&&cards.length>1){var last=rank[rank.length-1];if(!rewarded[last.id]){awards.push({id:last.id,owner:last.owner,fam:last.fam,v:last.v,amt:sp.v,place:'last'});rewarded[last.id]=1;}}}
 var effects=[];
 cards.forEach(function(c){var ch=CHARS[c.v];if(ch.t!=='end'||canceled[c.id])return;var base={id:c.id,owner:c.owner,fam:c.fam,v:c.v};
  if(ch.k==='spy'){if(cards.filter(function(d){return d.owner===c.owner;}).length===1)effects.push(Object.assign({},base,{amt:RULES.SPY_GOLD,why:'สายลับหมอกแฝงตัวลำพัง'}));}
  else if(ch.k==='merchant'){var m=cards.filter(function(d){return d.v<c.v;}).length;if(m>0)effects.push(Object.assign({},base,{amt:m,why:'ค้าขายกับการ์ดค่าต่ำกว่า '+m+' ใบ'}));}
  else if(ch.k==='peasant'){if(!rewarded[c.id])effects.push(Object.assign({},base,{amt:RULES.PEASANT_GOLD,why:'เก็บเกี่ยวสวนเมฆ'}));}
  else if(ch.k==='queen'){if(cards.some(function(d){return d.v===15;}))effects.push(Object.assign({},base,{amt:RULES.QUEEN_GOLD,why:'เคียงข้างจักรพรรดิจันทรา'}));}});
 return {reversed:reversed,canceled:Object.keys(canceled),awards:awards,effects:effects,rewarded:Object.keys(rewarded),blocked:blocked};
}
function projectGold(locs,n){var g=[];for(var i=0;i<n;i++)g.push(0);locs.forEach(function(L){var r=scoreLoc(L);r.awards.forEach(function(a){g[a.owner]+=a.amt;});r.effects.forEach(function(e){g[e.owner]+=e.amt;});});return g;}
function abilityOptions(B,kind,src){
 var s=findCard(B,src);if(!s)return [];var opts=[],cs;
 if(kind==='hunter'){B.locs.forEach(function(L,li){var t=null;for(var i=0;i<L.cards.length;i++){var c=L.cards[i];if(c.id!==src&&!isProt(c)){t=c;break;}}if(t)opts.push({key:'h'+li,li:li,target:t.id});});}
 else if(kind==='guard'){cs=B.locs[s.li].cards;[s.i-1,s.i+1].forEach(function(j){var t=cs[j];if(t&&!isProt(t))[0,1,2].forEach(function(li){if(li!==s.li)opts.push({key:'g'+t.id+'_'+li,target:t.id,li:li});});});}
 else if(kind==='bard'){B.locs.forEach(function(L,li){if(li===s.li)return;L.cards.forEach(function(c){if(!isProt(c))opts.push({key:'b'+c.id,target:c.id,li:s.li,from:li});});});}
 else if(kind==='alch'){cs=B.locs[s.li].cards;[s.i-1,s.i+1].forEach(function(j){var t=cs[j];if(t){var ch=CHARS[t.v];if(ch.t==='now'&&ch.k!=='alch'&&!opts.some(function(o){return o.copy===ch.k;}))opts.push({key:'a'+t.id,copy:ch.k,target:t.id});}});}
 if(opts.length)opts.push({key:'skip'});return opts;
}
var NULLCTX={log:function(){},discard:function(){},coin:function(){}};
function applyAuto(B,kind,src,ctx){
 var s=findCard(B,src);if(!s)return;var o=s.c.owner,cards=B.locs[s.li].cards,i;
 if(kind==='thief'){var k=null;for(i=0;i<cards.length;i++)if(cards[i].v===15&&cards[i].owner!==o){k=cards[i];break;}
  if(k){removeCard(B,k.id);ctx.discard(k);ctx.log(function(){return 'นักฉกเงาของ '+N(o)+' ลอบปลดจักรพรรดิจันทราของ '+N(k.owner)+' ที่'+LNS(s.li)+'!';});}
  else{var t=null;for(i=0;i<cards.length;i++)if(cards[i].owner!==o){t=cards[i];break;}
   if(t&&B.gold[t.owner]>0){B.gold[t.owner]--;B.gold[o]++;ctx.coin(o,1);ctx.coin(t.owner,-1);ctx.log(function(){return 'นักฉกเงาของ '+N(o)+' ฉก 1 เหรียญจาก '+N(t.owner);});}
   else ctx.log(function(){return 'นักฉกเงาของ '+N(o)+' ไม่พบเป้าหมาย';});}}
 else if(kind==='tax'){var opp=[];cards.forEach(function(c){if(c.owner!==o&&opp.indexOf(c.owner)<0)opp.push(c.owner);});var got=0;
  opp.forEach(function(p){if(B.gold[p]>0){B.gold[p]--;B.gold[o]++;got++;ctx.coin(p,-1);}});if(got)ctx.coin(o,got);ctx.log(function(){return 'นายด่านดวงดาวของ '+N(o)+' เก็บค่าผ่านทางได้ '+got+' เหรียญ';});}
 else if(kind==='prince'){if(s.i===0){B.gold[o]+=RULES.PRINCE_GOLD;ctx.coin(o,RULES.PRINCE_GOLD);ctx.log(function(){return 'เจ้าชายดาวหางของ '+N(o)+' นำหน้าที่'+LNS(s.li)+' ได้ '+RULES.PRINCE_GOLD+' เหรียญ';});}
  else ctx.log(function(){return 'เจ้าชายดาวหางของ '+N(o)+' ไม่ได้อยู่ลำดับแรก';});}
}
function applyChoice(B,kind,src,opt,ctx){
 if(!opt||opt.key==='skip'){ctx.log('ข้ามความสามารถ');return null;}
 var s=findCard(B,src);if(!s)return null;var o=s.c.owner;
 if(kind==='hunter'){var c=removeCard(B,opt.target);if(c){ctx.discard(c);ctx.log(function(){return 'พรานเหยี่ยวฟ้าของ '+N(o)+' ล่า '+CN(c)+' ของ '+N(c.owner)+' ที่'+LNS(opt.li);});}}
 else if(kind==='guard'||kind==='bard'){var f=findCard(B,opt.target);if(!f)return null;var from=f.li;var c2=removeCard(B,opt.target);var cs=B.locs[opt.li].cards;cs.splice(autoPos(cs,c2.v),0,c2);
  ctx.log(function(){return kind==='guard'?'ผู้พิทักษ์โคมของ '+N(o)+' ย้าย '+CN(c2)+' จาก'+LNS(from)+' ไป'+LNS(opt.li):'นักขับลำนำลมของ '+N(o)+' เรียก '+CN(c2)+' จาก'+LNS(from)+' มายัง'+LNS(opt.li);});}
 else if(kind==='alch'){ctx.log(function(){return 'นักปรุงละอองดาวของ '+N(o)+' คัดลอกพลังของ'+CHARS[KIND_V[opt.copy]].n;});return {copy:opt.copy};}
 return null;
}

/* ---------- authoritative engine ---------- */
var S=null,ACKPID=0,botBusy={};
var Ctl={mode:null,me:0,soloCfg:null};
function N(i){return S&&S.players[i]?S.players[i].name:'?';}
function CN(c){return CHARS[c.v].n+'('+c.v+')';}
function LNS(li){return S&&S.locs[li]?LT[S.locs[li].type].n:'';}
var CTX={log:function(f){log(f);},discard:function(c){S.discard.push(c);},coin:function(p,a){ev({type:'coin',pid:p,amt:a});}};
function log(f){S.log.push({id:++S.logSeq,r:S.round,t:typeof f==='function'?f():f});if(S.log.length>400)S.log.shift();}
function ev(e){e.id=++S.evSeq;S.events.push(e);if(S.events.length>60)S.events.shift();}
function nd(){return 'd'+(++S.subSeq)+'-'+S.gid.slice(0,5);}
function orderFrom(f,n){var a=[];for(var k=0;k<n;k++)a.push((f+k)%n);return a;}
function drawUp(p){while(p.hand.length<RULES.HAND&&p.deck.length)p.hand.push(p.deck.pop());p.hand.sort(function(a,b){return b.v-a.v;});}
function initGame(players){
 var n=players.length;
 S={gid:uid(),subSeq:0,round:1,turn:1,phase:'select',revealIdx:-1,sub:null,log:[],logSeq:0,events:[],evSeq:0,discard:[],history:[],scoring:null,final:null};
 S.players=players.map(function(p,i){var deck=[];for(var k=1;k<=15;k++)deck.push({id:p.fam+'-'+k,v:k,owner:i,fam:p.fam});
  return {name:p.name,fam:p.fam,isBot:!!p.isBot,persona:p.persona||null,connected:true,hand:[],selected:null,deck:shuffle(deck)};});
 S.gold=[];for(var i=0;i<n;i++)S.gold.push(RULES.START_GOLD);
 S.locs=['castle','village','port'].map(function(t){var cs=LOCATION_CARDS.filter(function(c){return c.type===t;});var lc=cs[rnd(cs.length)];return {type:t,cardId:lc.id,side:clone(lc.sides[rnd(2)]),cards:[]};});
 S.first=rnd(n);S.order=orderFrom(S.first,n);S.players.forEach(drawUp);botBusy={};
 log('เริ่มเกม! '+n+' กิลด์ชิงแสงจันทร์ — '+N(S.first)+' ถือธงโคมผู้เริ่มก่อน');
 S.locs.forEach(function(L){log(LT[L.type].n+': '+L.side.n+' ('+L.cardId+'-'+L.side.s+') รางวัล '+L.side.r.join('/'));});
 log('— รอบที่ 1 —');ev({type:'sfx',n:'round'});
}
function pendingFor(pid){
 if(!S||pid<0||pid>=S.players.length)return null;
 if(S.phase==='select'){var p=S.players[pid];if(!p.selected&&p.hand.length)return {did:'sel-'+S.round+'-'+S.turn+'-'+pid+'-'+S.gid.slice(0,5),kind:'select',options:p.hand.map(function(c){return c.id;})};return null;}
 if((S.phase==='reveal'||S.phase==='scoring')&&S.sub&&S.sub.pid===pid)return {did:S.sub.did,kind:S.sub.kind,options:S.sub.options||null,li:S.sub.li,card:S.sub.card||null,ability:S.sub.ability||null,src:S.sub.src||null};
 return null;
}
function submit(pid,did,a){
 var d=pendingFor(pid);if(!d)return 'ยังไม่ถึงตาของคุณ';if(d.did!==did)return 'คำสั่งล้าสมัย (สถานะเกมเปลี่ยนแล้ว)';
 if(!a||typeof a!=='object'||a.type!==d.kind)return 'คำสั่งไม่ถูกต้อง';
 if(d.kind==='select'){var p=S.players[pid];var idx=-1;for(var i=0;i<p.hand.length;i++)if(p.hand[i].id===a.card)idx=i;if(idx<0)return 'ไม่มีการ์ดนี้ในมือ';
  p.selected=p.hand.splice(idx,1)[0];ev({type:'sfx',n:'select'});if(S.players.every(function(q){return q.selected||!q.hand.length;}))beginReveal();}
 else if(d.kind==='place'){var li=a.loc;if(!Number.isInteger(li)||li<0||li>2)return 'สถานที่ไม่ถูกต้อง';var card=S.sub.card;var tp=tiePositions(S.locs[li].cards,card.v);
  if(tp)S.sub={kind:'tie',pid:pid,card:card,li:li,options:tp,did:nd()};else doPlace(li,autoPos(S.locs[li].cards,card.v));}
 else if(d.kind==='tie'){if(!Number.isInteger(a.pos)||S.sub.options.indexOf(a.pos)<0)return 'ตำแหน่งไม่ถูกต้อง';doPlace(S.sub.li,a.pos);}
 else if(d.kind==='ability'){var opt=null;S.sub.options.forEach(function(o){if(o.key===a.key)opt=o;});if(!opt)return 'เป้าหมายไม่ถูกต้อง';resolveChoice(opt);}
 else if(d.kind==='ack'){advanceRound();}
 return null;
}
function beginReveal(){S.phase='reveal';S.revealIdx=-1;log('— เปิดการ์ด เทิร์น '+S.turn+' —');nextReveal();}
function setPlaceSub(){var pid=S.order[S.revealIdx];var card=S.players[pid].selected;S.sub={kind:'place',pid:pid,card:card,options:[0,1,2],did:nd()};log(N(pid)+' เปิด '+CN(card));ev({type:'reveal',card:card.id});ev({type:'sfx',n:'reveal'});}
function doPlace(li,pos){var pid=S.sub.pid,card=S.sub.card;S.locs[li].cards.splice(pos,0,card);S.players[pid].selected=null;
 log(N(pid)+' วาง '+CN(card)+' ที่'+LNS(li)+' (ลำดับ '+(pos+1)+')');ev({type:'place',card:card.id});ev({type:'sfx',n:'place'});
 var ch=CHARS[card.v];if(ch.t==='now'){ev({type:'sfx',n:'ability'});if(runAbility(ch.k,card.id,pid)==='wait')return;}nextReveal();}
function runAbility(kind,src,pid){
 if(isChoice(kind)){var opts=abilityOptions(S,kind,src);if(!opts.length){log(CHARS[KIND_V[kind]].n+': ไม่มีเป้าหมายที่ใช้ได้');return 'done';}
  var fc=findCard(S,src);S.sub={kind:'ability',ability:kind,src:src,pid:pid,options:opts,did:nd(),card:Object.assign({},fc.c)};return 'wait';}
 applyAuto(S,kind,src,CTX);return 'done';}
function resolveChoice(opt){var ability=S.sub.ability,src=S.sub.src,pid=S.sub.pid;var r=applyChoice(S,ability,src,opt,CTX);if(r&&r.copy){if(runAbility(r.copy,src,pid)==='wait')return;}nextReveal();}
function nextReveal(){
 do{S.revealIdx++;}while(S.revealIdx<S.order.length&&!S.players[S.order[S.revealIdx]].selected);
 if(S.revealIdx<S.order.length)setPlaceSub();else endTurn();}
function endTurn(){S.sub=null;S.revealIdx=-1;if(S.turn>=RULES.TURNS)endRound();else{S.turn++;S.phase='select';}}
function endRound(){
 var n=S.players.length,gains=[],res=[];for(var i=0;i<n;i++)gains.push(0);
 log('— สิ้นรอบที่ '+S.round+': คิดรางวัล —');
 S.locs.forEach(function(L,li){var r=scoreLoc(L);
  r.awards.forEach(function(a){S.gold[a.owner]+=a.amt;gains[a.owner]+=a.amt;log(LT[L.type].n+': '+N(a.owner)+' '+CN(a)+' ได้ '+a.amt+' เหรียญ');});
  r.effects.forEach(function(e){S.gold[e.owner]+=e.amt;gains[e.owner]+=e.amt;log(N(e.owner)+' '+CN(e)+': '+e.why+' +'+e.amt);});
  var rw=r.rewarded;L.cards.forEach(function(c){if(rw.indexOf(c.id)>=0)S.discard.push(c);});L.cards=L.cards.filter(function(c){return rw.indexOf(c.id)<0;});
  res.push({li:li,type:L.type,name:L.side.n,reversed:r.reversed,canceled:r.canceled.length,awards:r.awards,effects:r.effects,blocked:r.blocked,kept:L.cards.length});});
 gains.forEach(function(g,i){if(g>0)ev({type:'coin',pid:i,amt:g});});
 S.history.push({round:S.round,gains:gains.slice(),goldAfter:S.gold.slice()});
 S.scoring={round:S.round,locs:res,gains:gains};S.phase='scoring';S.sub={kind:'ack',pid:ACKPID,did:nd()};ev({type:'sfx',n:'round'});
}
function advanceRound(){
 if(S.round>=RULES.ROUNDS){finish();return;}
 var n=S.players.length;S.round++;S.turn=1;S.first=(S.first+1)%n;S.order=orderFrom(S.first,n);S.players.forEach(drawUp);
 S.phase='select';S.sub=null;S.scoring=null;log('— รอบที่ '+S.round+': เติมมือ ธงโคมไปที่ '+N(S.first)+' —');ev({type:'sfx',n:'round'});
}
function finish(){
 var st=S.players.map(function(p,i){return {i:i,gold:S.gold[i]};}).sort(function(a,b){return b.gold-a.gold;});var top=st[0].gold;
 S.final={standings:st,winners:st.filter(function(x){return x.gold===top;}).map(function(x){return x.i;})};S.phase='over';S.sub=null;S.scoring=null;
 log('จบเกม! ผู้ชนะ: '+S.final.winners.map(N).join(', ')+' ('+top+' เหรียญ)');ev({type:'sfx',n:'victory'});
}
function makeView(pid){
 return {gid:S.gid,me:pid,ROUNDS:RULES.ROUNDS,TURNS:RULES.TURNS,round:S.round,turn:S.turn,phase:S.phase,first:S.first,order:S.order.slice(),revealIdx:S.revealIdx,
  players:S.players.map(function(p,i){return {name:p.name,fam:p.fam,isBot:p.isBot,persona:p.persona,connected:p.connected!==false,gold:S.gold[i],hand:p.hand.length,deck:p.deck.length,hasSel:!!p.selected,onBoard:S.locs.reduce(function(a,L){return a+L.cards.filter(function(c){return c.owner===i;}).length;},0)};}),
  gold:S.gold.slice(),locs:clone(S.locs),hand:clone(S.players[pid].hand),mySel:S.players[pid].selected?Object.assign({},S.players[pid].selected):null,
  sub:S.sub?{kind:S.sub.kind,pid:S.sub.pid,card:S.sub.card?Object.assign({},S.sub.card):null,li:S.sub.li,ability:S.sub.ability||null}:null,
  pending:clone(pendingFor(pid)),discard:S.discard.map(function(c){return c.id;}),log:S.log.slice(-150),events:S.events.slice(-40),scoring:clone(S.scoring),final:clone(S.final),history:clone(S.history)};
}

/* ---------- AI (sees only its own view) ---------- */
function boardOf(V){return {locs:clone(V.locs),gold:V.gold.slice()};}
function seenList(V){if(!V._seen){var s={};V.discard.forEach(function(id){s[id]=1;});V.locs.forEach(function(L){L.cards.forEach(function(c){s[c.id]=1;});});V._seen=s;}return V._seen;}
function threat(B,me,P,V){
 var seen=seenList(V),thiefOut=0,hunterOut=0;
 V.players.forEach(function(p,i){if(i===me)return;if(!seen[p.fam+'-1'])thiefOut++;if(!seen[p.fam+'-10'])hunterOut++;});
 var tf=(V.TURNS-V.turn+1)/V.TURNS,pen=0;
 B.locs.forEach(function(L){L.cards.forEach(function(c,idx){if(c.owner!==me)return;if(c.v===15&&thiefOut)pen+=P.risk*2.5*Math.min(1,thiefOut/2)*tf;if(idx===0&&hunterOut&&c.v>=10)pen+=P.risk*.8*tf;});});
 return pen;}
function evalB(B,me,P,V){var n=B.gold.length,proj=projectGold(B.locs,n),tot=B.gold.map(function(g,i){return g+proj[i];}),mx=-1e9,i;
 for(i=0;i<n;i++)if(i!==me)mx=Math.max(mx,tot[i]);
 var s=0,w=0;for(i=0;i<n;i++){if(i===me)continue;var wi=1+(tot[i]===mx?P.lead:0);s+=wi*tot[i];w+=wi;}return tot[me]-P.w*(w?s/w:0)-threat(B,me,P,V);}
function simAbilityBest(B,kind,src,me,P,V,depth){
 if(isChoice(kind)){var opts=abilityOptions(B,kind,src);if(!opts.length)return;var best=null,bu=-1e9;
  opts.forEach(function(o){var B2={locs:clone(B.locs),gold:B.gold.slice()};var r=applyChoice(B2,kind,src,o,NULLCTX);if(r&&r.copy&&depth<2)simAbilityBest(B2,r.copy,src,me,P,V,depth+1);var u=evalB(B2,me,P,V);if(u>bu){bu=u;best=B2;}});
  if(best){B.locs=best.locs;B.gold=best.gold;}}
 else applyAuto(B,kind,src,NULLCTX);}
function simPlaceEval(V,me,card,li,pos,P){var B=boardOf(V);B.locs[li].cards.splice(pos,0,Object.assign({},card));var ch=CHARS[card.v];if(ch.t==='now')simAbilityBest(B,ch.k,card.id,me,P,V,0);return evalB(B,me,P,V);}
function bestPlacement(V,me,card,P){var best={li:0,pos:0,u:-1e9};for(var li=0;li<3;li++){var cs=V.locs[li].cards;var ps=tiePositions(cs,card.v)||[autoPos(cs,card.v)];
 ps.forEach(function(pos){var u=simPlaceEval(V,me,card,li,pos,P)+(Math.random()-.5)*P.noise*.4;if(u>best.u)best={li:li,pos:pos,u:u};});}return best;}
function holdValue(V,c,P){var R=(V.ROUNDS-V.round)*V.TURNS+(V.TURNS-V.turn);var fr=Math.min(R,8)/8;var h=P.conserve*Math.pow(c.v/15,2)*3*fr;
 var seen=seenList(V);if(CHARS[c.v].k==='thief'){var oppKingsUnseen=V.players.some(function(p,i){return i!==V.me&&!seen[p.fam+'-15'];});var kingOnBoard=V.locs.some(function(L){return L.cards.some(function(x){return x.v===15&&x.owner!==V.me;});});if(oppKingsUnseen&&!kingOnBoard)h+=P.conserve*1.5*fr;}
 if(CHARS[c.v].k==='witch'||CHARS[c.v].k==='hunter')h+=P.conserve*.4*fr;return h;}
function botDecide(V,d,pk){var P=PERSONAS[pk]||PERSONAS.strategic,me=V.me,best,bu;
 if(d.kind==='select'){best=V.hand[0];bu=-1e9;V.hand.forEach(function(c){var s=bestPlacement(V,me,c,P).u-holdValue(V,c,P)+(Math.random()-.5)*P.noise*2;if(s>bu){bu=s;best=c;}});return {type:'select',card:best.id};}
 if(d.kind==='place')return {type:'place',loc:bestPlacement(V,me,d.card,P).li};
 if(d.kind==='tie'){best=d.options[0];bu=-1e9;d.options.forEach(function(pos){var u=simPlaceEval(V,me,d.card,d.li,pos,P);if(u>bu){bu=u;best=pos;}});return {type:'tie',pos:best};}
 if(d.kind==='ability'){best=d.options[d.options.length-1];bu=-1e9;d.options.forEach(function(o){var B=boardOf(V);var r=applyChoice(B,d.ability,d.src,o,NULLCTX);if(r&&r.copy)simAbilityBest(B,r.copy,d.src,me,P,V,1);var u=evalB(B,me,P,V)+(o.key==='skip'?.05:0);if(u>bu){bu=u;best=o;}});return {type:'ability',key:best.key};}
 if(d.kind==='ack')return {type:'ack'};return null;}
function fallbackAction(d){if(d.kind==='select')return {type:'select',card:d.options[0]};if(d.kind==='place')return {type:'place',loc:0};if(d.kind==='tie')return {type:'tie',pos:d.options[0]};if(d.kind==='ability')return {type:'ability',key:'skip'};return {type:'ack'};}
function scheduleBots(){
 if(!S||S.phase==='over')return;var gid=S.gid;
 S.players.forEach(function(p,i){if(!p.isBot)return;var d=pendingFor(i);if(!d||botBusy[i]===d.did)return;botBusy[i]=d.did;
  var delay=d.kind==='select'?450+rnd(900):650+rnd(550);
  setTimeout(function(){if(!S||S.gid!==gid)return;var d2=pendingFor(i);if(!d2||d2.did!==d.did)return;var a;
   try{a=botDecide(makeView(i),d2,p.persona);}catch(e){console.error(e);a=fallbackAction(d2);}
   var err=submit(i,d2.did,a);if(err){console.warn('bot',err);var d3=pendingFor(i);if(d3&&d3.did===d2.did)submit(i,d2.did,fallbackAction(d2));}
   changed();},delay);});}
function changed(){if(!S)return;if(Ctl.mode==='host'){hostBroadcast();saveHost();}onView(makeView(Ctl.me));scheduleBots();}

/* ---------- audio ---------- */
var AU={ctx:null,m:null,sg:null,bg:null,st:{bgm:true,sfx:true,vol:.6},timer:null,step:0,next:0,ok:true,
 load:function(){try{Object.assign(this.st,JSON.parse(lsGet(LSK.audio)||'{}'));}catch(e){}},
 save:function(){lsSet(LSK.audio,JSON.stringify(this.st));},
 init:function(){if(this.ctx||!this.ok)return;try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC){this.ok=false;return;}var c=new AC();this.ctx=c;
  this.m=c.createGain();this.m.gain.value=this.st.vol;this.m.connect(c.destination);this.sg=c.createGain();this.sg.connect(this.m);this.bg=c.createGain();this.bg.gain.value=.35;this.bg.connect(this.m);}catch(e){this.ok=false;this.ctx=null;}},
 unlock:function(){this.init();if(!this.ctx)return;if(this.ctx.state==='suspended')this.ctx.resume().catch(function(){});if(this.st.bgm)this.startBgm();},
 setVol:function(v){this.st.vol=v;if(this.m)this.m.gain.value=v;this.save();},
 tone:function(f,d,type,g,at,dest){var c=this.ctx;if(!c)return;try{var o=c.createOscillator(),gn=c.createGain();o.type=type||'triangle';o.frequency.value=f;var t=Math.max(c.currentTime,at||0);
  gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g||.2,t+.012);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(dest||this.sg);o.start(t);o.stop(t+d+.05);}catch(e){}},
 sfx:function(n){if(!this.ctx||!this.st.sfx)return;var self=this,t=this.ctx.currentTime;function T(f,d,ty,g,o){self.tone(f,d,ty,g,t+(o||0));}
  if(n==='click')T(880,.05,'sine',.06);
  else if(n==='select'){T(660,.09,'sine',.14);T(990,.12,'sine',.1,.06);}
  else if(n==='reveal'){T(520,.12,'triangle',.1);T(780,.14,'sine',.1,.05);T(1170,.2,'sine',.07,.1);}
  else if(n==='place'){T(196,.12,'triangle',.14);T(130,.16,'sine',.16,.02);}
  else if(n==='ability')[784,988,1175,1568].forEach(function(f,i){T(f,.22,'sine',.09,i*.05);});
  else if(n==='coin'){T(1568,.08,'square',.04);T(2093,.2,'sine',.06,.07);}
  else if(n==='round')[523,659,784,1047].forEach(function(f,i){T(f,.35,'sine',.12,i*.12);});
  else if(n==='victory'){[523,659,784,1047,0,784,1047,1319].forEach(function(f,i){if(f)T(f,.4,'triangle',.15,i*.17);});[262,330,392,523].forEach(function(f){T(f,1.8,'sine',.07,1.4);});}
  else if(n==='error')T(220,.15,'square',.07);},
 startBgm:function(){if(!this.ctx||this.timer)return;var self=this;this.next=this.ctx.currentTime+.1;this.timer=setInterval(function(){self.sched();},150);},
 stopBgm:function(){clearInterval(this.timer);this.timer=null;},
 sched:function(){var c=this.ctx;if(!c)return;var mel=[0,4,7,9,7,4,2,4,7,9,12,9,7,4,2,null,0,2,4,7,4,2,0,-3,0,2,4,2,0,null,-3,null],base=329.63;
  while(this.next<c.currentTime+.5){var s=mel[this.step%mel.length];if(s!==null)this.tone(base*Math.pow(2,s/12),.42,'sine',.055,this.next,this.bg);
   if(this.step%8===0){this.tone(base/2,2.4,'sine',.045,this.next,this.bg);this.tone(base*.75,2.4,'sine',.022,this.next,this.bg);}this.next+=.3;this.step++;}}};

/* ---------- networking (PeerJS / WebRTC, host-authoritative) ---------- */
var NET={role:null,peer:null,code:'',name:'',token:'',conns:{},hostConn:null,lobby:null,started:false,seen:{},seenN:0,seat:-1,want:false,everJoined:false,lastHost:0,lastSeen:{},timers:[],status:''};
function genCode(){var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';for(var i=0;i<5;i++)s+=A[rnd(A.length)];return s;}
function inviteLink(code){return location.href.split('#')[0].split('?')[0]+'?room='+code;}
function setStatus(m){NET.status=m;if(['online','lobby','game'].indexOf(UI.screen)>=0)render();}
function netReset(){NET.timers.forEach(function(t){clearInterval(t);});NET.timers=[];try{if(NET.peer)NET.peer.destroy();}catch(e){}
 Object.assign(NET,{role:null,peer:null,code:'',conns:{},hostConn:null,lobby:null,started:false,seen:{},seenN:0,seat:-1,want:false,everJoined:false,lastSeen:{},status:''});}
function netLeave(){if(NET.role==='host')lsDel(LSK.host);netReset();}
function saveHost(){if(NET.role!=='host')return;try{lsSet(LSK.host,JSON.stringify({code:NET.code,name:NET.name,lobby:NET.lobby,started:NET.started,S:NET.started?S:null,ts:Date.now()}));}catch(e){}}
function loadHostSave(){try{var s=JSON.parse(lsGet(LSK.host)||'null');if(s&&Date.now()-s.ts<6*3600e3)return s;}catch(e){}return null;}
function hostCreate(name,restore){
 if(!window.Peer){toast('โหลดไลบรารีเครือข่ายไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ต');return;}
 netReset();S=null;NET.role='host';NET.name=name;NET.code=restore?restore.code:genCode();NET.seat=0;Ctl.mode='host';Ctl.me=0;ACKPID=0;
 if(restore){NET.lobby=restore.lobby;NET.lobby.players.forEach(function(p,i){p.connected=i===0;});NET.started=!!(restore.started&&restore.S);if(NET.started){S=restore.S;S.players.forEach(function(p,i){p.connected=i===0;});}}
 else NET.lobby={players:[{name:name,token:NET.token,fam:UI.fam,connected:true}]};
 var tries=0;setStatus('กำลังเปิดห้อง…');
 function open(){var peer=new Peer(PEER_PREFIX+NET.code,{config:{iceServers:ICE_SERVERS},debug:1});NET.peer=peer;
  peer.on('open',function(){setStatus('ห้องออนไลน์พร้อม ✓');if(NET.started){UI.screen='game';UI.lastEv=-1;changed();}else{UI.screen='lobby';hostBroadcast();render();}});
  peer.on('connection',function(conn){conn.seat=null;conn.on('data',function(d){hostOnData(conn,d);});conn.on('close',function(){hostOnClose(conn);});conn.on('error',function(){hostOnClose(conn);});});
  peer.on('disconnected',function(){setStatus('สัญญาณ signaling หลุด — กำลังเชื่อมใหม่…');setTimeout(function(){try{if(!peer.destroyed)peer.reconnect();}catch(e){}},1500);});
  peer.on('error',function(e){if(e.type==='unavailable-id'){try{peer.destroy();}catch(x){}if(restore&&tries<6){tries++;setStatus('รอรหัสห้องเดิมว่าง… ('+tries+')');setTimeout(open,4000);}else if(!restore){NET.code=genCode();open();}else setStatus('กู้ห้องไม่สำเร็จ');}
   else if(e.type!=='peer-unavailable')setStatus('ข้อผิดพลาดเครือข่าย: '+e.type);});}
 open();NET.timers.push(setInterval(hostHeartbeat,3000));
}
function lobbyPublic(){return {code:NET.code,players:NET.lobby.players.map(function(p){return {name:p.name,fam:p.fam,connected:p.connected};})};}
function hostBroadcast(){
 if(!NET.lobby)return;
 if(!NET.started){var L=lobbyPublic();Object.keys(NET.conns).forEach(function(k){var c=NET.conns[k];if(c&&c.open)try{c.send({t:'lobby',lobby:L});}catch(e){}});if(UI.screen==='lobby')render();}
 else Object.keys(NET.conns).forEach(function(k){sendView(+k);});}
function sendView(seat){var c=NET.conns[seat];if(c&&c.open&&S)try{c.send({t:'view',view:makeView(seat)});}catch(e){}}
function markConn(seat,val){var p=NET.lobby.players[seat];if(!p)return;var ch=p.connected!==val;p.connected=val;if(S&&NET.started&&S.players[seat])S.players[seat].connected=val;
 if(ch){if(NET.started){log(N(seat)+' '+(val?'กลับมาออนไลน์':'ขาดการเชื่อมต่อ'));changed();}else hostBroadcast();}}
function hostOnData(conn,m){
 if(!m||typeof m!=='object')return;
 if(m.t==='hello'){hostHello(conn,m);return;}
 if(conn.seat==null||NET.conns[conn.seat]!==conn)return;var seat=conn.seat;NET.lastSeen[seat]=Date.now();
 if(m.t==='ping'){if(NET.lobby.players[seat]&&!NET.lobby.players[seat].connected)markConn(seat,true);try{conn.send({t:'pong'});}catch(e){}return;}
 if(m.t==='fam'&&!NET.started){setFam(seat,m.fam);return;}
 if(m.t==='act'&&NET.started&&S){
  if(typeof m.aid!=='string'||NET.seen[m.aid]){try{conn.send({t:'err',msg:'คำสั่งซ้ำ — ถูกปฏิเสธ'});}catch(e){}return;}
  NET.seen[m.aid]=1;NET.seenN++;if(NET.seenN>3000){NET.seen={};NET.seen[m.aid]=1;NET.seenN=1;}
  var err=submit(seat,m.did,m.a);if(err){try{conn.send({t:'err',msg:err});}catch(e){}sendView(seat);}else changed();}}
function hostHello(conn,m){
 function rej(r){try{conn.send({t:'reject',reason:r});}catch(e){}setTimeout(function(){try{conn.close();}catch(e){}},500);}
 var name=String(m.name||'').trim().slice(0,16),token=String(m.token||'');if(!name)return rej('กรุณาใส่ชื่อ');
 var L=NET.lobby.players,seat=-1;L.forEach(function(p,i){if(p.name===name)seat=i;});
 if(seat===0)return rej('ชื่อซ้ำกับเจ้าห้อง');
 if(seat>0){var p=L[seat],old=NET.conns[seat];if(p.connected&&p.token!==token&&old&&old.open&&Date.now()-(NET.lastSeen[seat]||0)<9000)return rej('ชื่อนี้มีผู้เล่นออนไลน์อยู่แล้ว');
  if(old&&old!==conn){old.seat=null;try{old.close();}catch(e){}}p.token=token;}
 else{if(NET.started)return rej('เกมเริ่มแล้ว — กลับเข้าได้เฉพาะชื่อผู้เล่นเดิม');if(L.length>=5)return rej('ห้องเต็ม (5 คน)');
  var used=L.map(function(q){return q.fam;});var free=[0,1,2,3,4].filter(function(f){return used.indexOf(f)<0;})[0];L.push({name:name,token:token,fam:free,connected:true});seat=L.length-1;}
 conn.seat=seat;NET.conns[seat]=conn;NET.lastSeen[seat]=Date.now();try{conn.send({t:'welcome',seat:seat,code:NET.code});}catch(e){}
 if(NET.started){L[seat].connected=false;markConn(seat,true);sendView(seat);}else{L[seat].connected=true;hostBroadcast();saveHost();}}
function hostOnClose(conn){
 if(!conn||conn.seat==null)return;var seat=conn.seat;if(NET.conns[seat]!==conn)return;delete NET.conns[seat];conn.seat=null;
 if(!NET.started){NET.lobby.players.splice(seat,1);var nc={},ls={};Object.keys(NET.conns).forEach(function(k){var c=NET.conns[k];if(c.seat>seat)c.seat--;nc[c.seat]=c;ls[c.seat]=Date.now();});NET.conns=nc;NET.lastSeen=ls;
  Object.keys(NET.conns).forEach(function(k){try{NET.conns[k].send({t:'welcome',seat:+k,code:NET.code});}catch(e){}});hostBroadcast();}
 else markConn(seat,false);}
function hostHeartbeat(){var now=Date.now();Object.keys(NET.conns).forEach(function(k){var s=+k,c=NET.conns[k];if(!c)return;if(now-(NET.lastSeen[s]||0)>12000){if(NET.started)markConn(s,false);else{try{c.close();}catch(e){}hostOnClose(c);}}});}
function setFam(seat,f){f=+f;if(!(f>=0&&f<5))return;var L=NET.lobby.players;if(!L[seat])return;if(L.some(function(p,i){return i!==seat&&p.fam===f;})){if(seat===0)toast('กิลด์นี้มีผู้เลือกแล้ว');return;}L[seat].fam=f;hostBroadcast();saveHost();}
function hostStart(){var L=NET.lobby.players;if(L.length<3)return toast('ต้องมีผู้เล่นอย่างน้อย 3 คน');if(L.some(function(p){return !p.connected;}))return toast('มีผู้เล่นที่ยังไม่ได้เชื่อมต่อ');
 var fs=L.map(function(p){return p.fam;});if(fs.some(function(f,i){return fs.indexOf(f)!==i;}))return toast('กิลด์ซ้ำกัน');
 initGame(L.map(function(p){return {name:p.name,fam:p.fam,isBot:false};}));NET.started=true;ACKPID=0;Ctl.me=0;UI.lastEv=-1;UI.screen='game';changed();}
function clientJoin(name,code){
 if(!window.Peer){toast('โหลดไลบรารีเครือข่ายไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ต');return;}
 netReset();S=null;NET.role='client';NET.name=name;NET.code=code;NET.want=true;Ctl.mode='client';setStatus('กำลังเชื่อมต่อ signaling…');
 var peer=new Peer({config:{iceServers:ICE_SERVERS},debug:1});NET.peer=peer;
 peer.on('open',function(){setStatus('กำลังติดต่อเจ้าห้อง…');connectHost();});
 peer.on('disconnected',function(){setTimeout(function(){try{if(!peer.destroyed)peer.reconnect();}catch(e){}},1500);});
 peer.on('error',function(e){if(e.type==='peer-unavailable'){if(NET.everJoined){setStatus('ไม่พบเจ้าห้อง — จะลองใหม่…');retryLater();}else{setStatus('ไม่พบห้อง '+code);toast('ไม่พบห้องนี้ ตรวจสอบรหัสอีกครั้ง');NET.want=false;}}else setStatus('ข้อผิดพลาด: '+e.type);});
 NET.timers.push(setInterval(clientHeartbeat,3000));}
function connectHost(){
 var peer=NET.peer;if(!peer||peer.destroyed||!NET.want)return;if(peer.disconnected){try{peer.reconnect();}catch(e){}retryLater();return;}
 var conn=peer.connect(PEER_PREFIX+NET.code,{reliable:true});NET.hostConn=conn;
 conn.on('open',function(){NET.lastHost=Date.now();conn.send({t:'hello',name:NET.name,token:NET.token});});
 conn.on('data',function(d){if(conn!==NET.hostConn)return;NET.lastHost=Date.now();clientOnData(d);});
 conn.on('close',function(){if(conn===NET.hostConn){NET.hostConn=null;setStatus('การเชื่อมต่อขาด — กำลังเชื่อมใหม่…');retryLater();}});
 conn.on('error',function(){});}
var retryT=null;function retryLater(){if(retryT||!NET.want)return;retryT=setTimeout(function(){retryT=null;connectHost();},3000);}
function clientHeartbeat(){var c=NET.hostConn;if(c&&c.open){try{c.send({t:'ping'});}catch(e){}if(Date.now()-NET.lastHost>12000){setStatus('สัญญาณจากเจ้าห้องขาด — เชื่อมใหม่…');NET.hostConn=null;try{c.close();}catch(e){}retryLater();}}else if(NET.want&&!c)retryLater();}
function clientOnData(m){if(!m||typeof m!=='object')return;
 if(m.t==='welcome'){NET.seat=m.seat;Ctl.me=m.seat;NET.everJoined=true;setStatus('เชื่อมต่อแล้ว ✓');}
 else if(m.t==='lobby'){NET.lobby=m.lobby;NET.started=false;UI.view=null;UI.screen='lobby';render();}
 else if(m.t==='view'){NET.started=true;onView(m.view);}
 else if(m.t==='reject'){toast(m.reason);NET.want=false;netReset();Ctl.mode=null;UI.screen='online';render();}
 else if(m.t==='err'){toast(m.msg);UI.sentDid=null;if(UI.screen==='game')render();}}

/* ===================== UI ===================== */

 var ended=V.phase==='scoring'||V.phase==='over',remain=ended?0:V.TURNS-V.turn;

  if(V.phase==='select'){if(p.hasSel){st='✓';sc='ok';stt='คว่ำการ์ดแล้ว';}else{st='…';stt='กำลังเลือก';}}

 var pick=!!(d&&d.kind==='place'&&!sent);

 var board=V.locs.map(function(L,li){var r=scoreLoc(L),amt={};

 return '<div class="game">'+top+'<div class="pstrip">'+chips+'</div><div class="board">'+board+'</div><div class="prompt'+(d&&!sent&&V.phase!=='scoring'?' yours':'')+'">'+vPrompt(V)+'</div>'+hand+ov+ban+'</div>';}

function fitAll(){document.querySelectorAll('[data-fit]').forEach(function(el){el.style.transform='';var p=el.parentElement;if(!p)return;var cs=getComputedStyle(p);
 var aw=p.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=p.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
 var w=el.offsetWidth,h=el.offsetHeight;if(!w||!h||aw<=0||ah<=0)return;var s=Math.min(1,aw/w,ah/h);if(s<.999)el.style.transform='scale('+s.toFixed(4)+')';});}

 for(var r=1;r<=n;r++){var c=Math.ceil(n/r);var h=Math.min((W-(c-1)*g)/c/0.7,(H-(r-1)*g)/r,120);if(h>best+.5){best=h;br=r;}}
 best=Math.max(18,Math.floor(best));box.style.setProperty('--h',best+'px');if(br>1)box.classList.add('wrap');if(best<58)box.classList.add('tiny');});}

function startSolo(){var nm=(UI.name||'').trim()||'ผู้เล่น';var n=UI.count;var fams=[0,1,2,3,4].filter(function(f){return f!==UI.fam;});var pk=shuffle(['strategic','aggressive','opportunist','deceptive']);var names=shuffle(BOT_NAMES.slice());
 var players=[{name:nm,fam:UI.fam,isBot:false}];for(var i=1;i<n;i++)players.push({name:names[i-1],fam:fams[i-1],isBot:true,persona:pk[(i-1)%4]});
 Ctl.soloCfg=players;Ctl.mode='solo';Ctl.me=0;ACKPID=0;initGame(players);UI.lastEv=-1;UI.view=null;UI.screen='game';changed();}
function again(){closeModal();if(Ctl.mode==='solo'){initGame(Ctl.soloCfg);UI.view=null;UI.lastEv=-1;changed();}else if(Ctl.mode==='host'){S=null;NET.started=false;UI.view=null;UI.screen='lobby';lsDel(LSK.host);hostBroadcast();render();}}
function getName(){var el=qs('#nameIn');var v=((el&&el.value)||UI.name||'').trim().slice(0,16);if(!v){toast('กรุณาใส่ชื่อ');return null;}UI.name=v;lsSet(LSK.name,v);return v;}
document.addEventListener('input',function(e){var t=e.target;if(t.id==='nameIn'){UI.name=t.value;lsSet(LSK.name,t.value);}
 else if(t.id==='codeIn'){t.value=t.value.toUpperCase().replace(/[^A-Z0-9]/g,'');UI.joinCode=t.value;}else if(t.id==='vol')AU.setVol(+t.value/100);});
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el||el.disabled)return;var s=el.getAttribute('data-act');var i=s.indexOf(':');var k=i<0?s:s.slice(0,i),arg=i<0?'':s.slice(i+1);
 switch(k){
  case 'go':UI.screen=arg;AU.sfx('click');render();break;
  case 'count':UI.count=+arg;AU.sfx('click');render();break;
  case 'fam':UI.fam=+arg;AU.sfx('select');render();break;
  case 'solostart':if(getName()!==null)startSolo();break;
  case 'create':{var nm=getName();if(nm){hostCreate(nm);render();}}break;
  case 'join':{var nm2=getName();if(!nm2)break;var ci=qs('#codeIn');var code=((ci&&ci.value)||'').toUpperCase().trim();if(!validCode(code)){toast('รหัสห้องต้องมี 5 ตัวอักษร');break;}UI.joinCode=code;clientJoin(nm2,code);render();}break;
  case 'restore':{var sv=loadHostSave();if(sv){UI.name=sv.name;hostCreate(sv.name,sv);render();}}break;
  case 'netinfo':showNetInfo();break;
  case 'lfam':if(NET.role==='host')setFam(0,+arg);else if(NET.hostConn&&NET.hostConn.open){try{NET.hostConn.send({t:'fam',fam:+arg});}catch(x){}}break;
  case 'lstart':hostStart();break;
  case 'copy':{var link=inviteLink(NET.code);var fb=function(){var inp=qs('#linkIn');if(inp){inp.select();try{document.execCommand('copy');toast('คัดลอกลิงก์แล้ว');}catch(x){toast('กรุณาคัดลอกลิงก์ด้วยตนเอง');}}};
   if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(link).then(function(){toast('คัดลอกลิงก์แล้ว');}).catch(fb);else fb();}break;
  case 'leave':netLeave();Ctl.mode=null;UI.screen='menu';render();break;
  case 'hand':{var V=UI.view;if(V&&V.pending&&V.pending.kind==='select'&&UI.sentDid!==V.pending.did){UI.selCard=arg;AU.sfx('select');render();}else showDetail(arg);}break;
  case 'confirmSel':if(UI.selCard)act({type:'select',card:UI.selCard});break;
  case 'loc':act({type:'place',loc:+arg});break;
  case 'tie':act({type:'tie',pos:+arg});break;
  case 'abil':act({type:'ability',key:arg});break;
  case 'ack':act({type:'ack'});break;
  case 'detail':showDetail(arg);break;
  case 'cdet':showCharDetail(arg);break;
  case 'tab':UI.rtab=arg;showRules();break;
  case 'bgclose':if(e.target===el)closeModal();break;
  case 'close':closeModal();break;
  case 'settings':showSettings();break;
  case 'tbgm':AU.st.bgm=!AU.st.bgm;AU.save();AU.unlock();if(!AU.st.bgm)AU.stopBgm();showSettings();break;
  case 'tsfx':AU.st.sfx=!AU.st.sfx;AU.save();showSettings();break;
  case 'log':showLog();break;
  case 'rules':showRules();break;
  case 'menuq':showGameMenu();break;
  case 'quit':quitGame();break;
  case 'again':again();break;}});
document.addEventListener('pointerdown',function(){AU.unlock();});
window.addEventListener('beforeunload',function(){if(Ctl.mode==='host'&&NET.started)saveHost();});

/* ===================== BOOT ===================== */
(function boot(){
 try{
  buildSprite();
  AU.load();
  NET.token=lsGet(LSK.token)||'';if(!NET.token){NET.token=uid();lsSet(LSK.token,NET.token);}
  UI.name=lsGet(LSK.name)||'';
  try{var q=new URLSearchParams(location.search).get('room');if(q){q=q.toUpperCase();if(validCode(q)){UI.joinCode=q;UI.screen='online';}}}catch(e){}
  render();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout).catch(function(){});
 }catch(e){console.error(e);if(window.LIfatal)window.LIfatal(e.message||e);}
})();
</script>
